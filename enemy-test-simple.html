<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钻石狂潮 - 敌人系统测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #00ff00;
            margin-bottom: 30px;
        }
        
        .test-section {
            background: #2a2a3e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        
        .test-section h2 {
            color: #ffd700;
            margin-top: 0;
        }
        
        .enemy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .enemy-card {
            background: #3a3a4e;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #555;
        }
        
        .enemy-card h3 {
            color: #ff6b6b;
            margin-top: 0;
        }
        
        .test-canvas {
            border: 2px solid #444;
            border-radius: 8px;
            background: #000;
            display: block;
            margin: 20px auto;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        .btn {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn:hover {
            background: #45b7aa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 钻石狂潮 - 敌人系统测试</h1>
        
        <div class="test-section">
            <h2>📊 敌人系统概览</h2>
            <p>本测试页面展示了《钻石狂潮》游戏中的5种敌人类型，每种敌人都有独特的行为模式、技能和弱点。</p>
            
            <div class="enemy-grid" id="enemy-grid">
                <!-- 敌人卡片将由JavaScript动态生成 -->
            </div>
        </div>
        
        <div class="test-section">
            <h2>🎯 实时敌人测试</h2>
            <p>在下面的画布中测试敌人的行为和互动：</p>
            
            <canvas id="test-canvas" class="test-canvas" width="800" height="600"></canvas>
            
            <div class="controls">
                <button class="btn" onclick="spawnRandomEnemy()">生成随机敌人</button>
                <button class="btn" onclick="spawnAllEnemies()">生成所有敌人</button>
                <button class="btn" onclick="clearEnemies()">清除敌人</button>
            </div>
        </div>
    </div>

    <script>
        let canvas = document.getElementById('test-canvas');
        let ctx = canvas.getContext('2d');
        let enemies = [];
        
        // 敌人类型配置
        const enemyTypes = [
            { type: 'snowApe', name: '雪猿', color: '#8B4513', world: '西藏雪山' },
            { type: 'shaolinMonk', name: '少林弟子', color: '#8B0000', world: '西藏雪山' },
            { type: 'redSnake', name: '红蛇', color: '#DC143C', world: '吴哥窟' },
            { type: 'poisonSpider', name: '毒蜘蛛', color: '#2F4F2F', world: '巴伐利亚地牢' },
            { type: 'saxKnight', name: '萨克斯骑士', color: '#2F4F4F', world: '巴伐利亚地牢' }
        ];
        
        // 生成敌人卡片
        function generateEnemyCards() {
            const enemyGrid = document.getElementById('enemy-grid');
            
            enemyTypes.forEach(enemyType => {
                const card = document.createElement('div');
                card.className = 'enemy-card';
                
                card.innerHTML = '<h3>' + enemyType.name + '</h3>' +
                    '<p><strong>世界:</strong> ' + enemyType.world + '</p>' +
                    '<p><strong>类型:</strong> ' + enemyType.type + '</p>';
                
                enemyGrid.appendChild(card);
            });
        }
        
        // 生成随机敌人
        function spawnRandomEnemy() {
            const enemyType = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
            const enemy = {
                x: Math.random() * (canvas.width - 64) + 32,
                y: Math.random() * (canvas.height - 64) + 32,
                color: enemyType.color,
                name: enemyType.name
            };
            enemies.push(enemy);
        }
        
        // 生成所有敌人
        function spawnAllEnemies() {
            const positions = [
                { x: 150, y: 150 }, { x: 250, y: 150 }, { x: 350, y: 150 },
                { x: 450, y: 150 }, { x: 550, y: 150 }
            ];
            
            enemyTypes.forEach((enemyType, index) => {
                const pos = positions[index];
                const enemy = {
                    x: pos.x,
                    y: pos.y,
                    color: enemyType.color,
                    name: enemyType.name
                };
                enemies.push(enemy);
            });
        }
        
        // 清除敌人
        function clearEnemies() {
            enemies = [];
        }
        
        // 游戏循环
        function gameLoop() {
            // 清除画布
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制敌人
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x - 16, enemy.y - 16, 32, 32);
                
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(enemy.name, enemy.x, enemy.y - 20);
            });
            
            requestAnimationFrame(gameLoop);
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            generateEnemyCards();
            gameLoop();
        });
    </script>
</body>
</html>
