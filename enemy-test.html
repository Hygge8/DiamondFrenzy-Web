<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钻石狂潮 - 敌人系统测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #00ff00;
            margin-bottom: 30px;
        }
        
        .test-section {
            background: #2a2a3e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        
        .test-section h2 {
            color: #ffd700;
            margin-top: 0;
        }
        
        .enemy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .enemy-card {
            background: #3a3a4e;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #555;
        }
        
        .enemy-card h3 {
            color: #ff6b6b;
            margin-top: 0;
        }
        
        .enemy-stats {
            font-size: 14px;
            line-height: 1.6;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #aaa;
        }
        
        .stat-value {
            color: #fff;
            font-weight: bold;
        }
        
        .abilities, .weaknesses {
            margin-top: 10px;
        }
        
        .abilities h4, .weaknesses h4 {
            color: #4ecdc4;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .abilities ul, .weaknesses ul {
            margin: 0;
            padding-left: 20px;
            font-size: 13px;
        }
        
        .abilities li {
            color: #4ecdc4;
        }
        
        .weaknesses li {
            color: #ff9999;
        }
        
        .world-tag {
            display: inline-block;
            background: #555;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        .angkor-wat { background: #8B4513; }
        .bavaria { background: #2F4F4F; }
        .tibet { background: #E0E0E0; color: #333; }
        
        .test-canvas {
            border: 2px solid #444;
            border-radius: 8px;
            background: #000;
            display: block;
            margin: 20px auto;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        .btn {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn:hover {
            background: #45b7aa;
        }
        
        .btn-danger {
            background: #ff6b6b;
        }
        
        .btn-danger:hover {
            background: #ff5252;
        }
        
        .info-panel {
            background: #3a3a4e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #555;
        }
        
        .info-panel h3 {
            color: #ffd700;
            margin-top: 0;
        }
        
        #enemy-info {
            font-family: monospace;
            font-size: 12px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 钻石狂潮 - 敌人系统测试</h1>
        
        <div class="test-section">
            <h2>📊 敌人系统概览</h2>
            <p>本测试页面展示了《钻石狂潮》游戏中的5种敌人类型，每种敌人都有独特的行为模式、技能和弱点。</p>
            
            <div class="enemy-grid" id="enemy-grid">
                <!-- 敌人卡片将由JavaScript动态生成 -->
            </div>
        </div>
        
        <div class="test-section">
            <h2>🎯 实时敌人测试</h2>
            <p>在下面的画布中测试敌人的行为和互动：</p>
            
            <canvas id="test-canvas" class="test-canvas" width="800" height="600"></canvas>
            
            <div class="controls">
                <button class="btn" onclick="spawnRandomEnemy()">生成随机敌人</button>
                <button class="btn" onclick="spawnAllEnemies()">生成所有敌人</button>
                <button class="btn" onclick="clearEnemies()">清除敌人</button>
                <button class="btn btn-danger" onclick="toggleDebug()">切换调试模式</button>
            </div>
            
            <div class="info-panel">
                <h3>📈 实时信息</h3>
                <div id="enemy-info">准备就绪...</div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>🔧 系统特性</h2>
            <ul>
                <li><strong>模块化设计</strong> - 每个敌人类都是独立的模块，易于维护和扩展</li>
                <li><strong>AI行为系统</strong> - 每种敌人都有独特的行为模式和状态机</li>
                <li><strong>环境互动</strong> - 敌人与环境对象（岩石、冰锥、机关等）有丰富的互动</li>
                <li><strong>动画系统</strong> - 支持帧动画和状态动画</li>
                <li><strong>音效集成</strong> - 每个行为都有对应的音效反馈</li>
                <li><strong>调试支持</strong> - 内置调试信息和可视化工具</li>
            </ul>
        </div>
    </div>

    <script>
        // 模拟游戏引擎和敌人管理器
        class MockGameEngine {
            constructor() {
                this.debugMode = false;
                this.audioManager = {
                    playSound: (sound) => console.log(`播放音效: ${sound}`)
                };
            }
            
            getGameState() {
                return {
                    player: { x: 400, y: 300, health: 100 },
                    level: {
                        getObjectsByType: (type) => [],
                        addReward: (reward) => console.log('获得奖励:', reward)
                    },
                    enemies: [],
                    audioManager: this.audioManager
                };
            }
        }
        
        // 模拟敌人管理器
        class MockEnemyManager {
            constructor() {
                this.enemies = [];
                this.gameState = new MockGameEngine().getGameState();
                this.enemyConfigs = {
                    'snowApe': { name: '雪猿', world: 'tibet' },
                    'shaolinMonk': { name: '少林弟子', world: 'tibet' },
                    'redSnake': { name: '红蛇', world: 'angkor_wat' },
                    'poisonSpider': { name: '毒蜘蛛', world: 'bavaria' },
                    'saxKnight': { name: '萨克斯骑士', world: 'bavaria' }
                };
            }
            
            createEnemy(type, x, y) {
                const config = this.enemyConfigs[type];
                if (!config) return null;
                
                const enemy = {
                    type: type,
                    name: config.name,
                    x: x,
                    y: y,
                    width: 32,
                    height: 32,
                    health: 100,
                    maxHealth: 100,
                    damage: 20,
                    state: 'idle',
                    isActive: true,
                    isDead: false,
                    isVisible: true,
                    getDescription: () => ({
                        name: config.name,
                        type: this.getEnemyType(type),
                        health: 100,
                        maxHealth: 100,
                        damage: 20,
                        abilities: this.getAbilities(type),
                        weaknesses: this.getWeaknesses(type),
                        world: config.world
                    }),
                    update: (deltaTime, gameState) => {
                        // 模拟更新逻辑
                        this.simulateBehavior(enemy, deltaTime);
                    },
                    render: (ctx) => {
                        // 模拟渲染逻辑
                        this.simulateRender(enemy, ctx);
                    }
                };
                
                this.enemies.push(enemy);
                return enemy;
            }
            
            getEnemyType(type) {
                const types = {
                    'snowApe': '追踪型敌人',
                    'shaolinMonk': '远程攻击敌人',
                    'redSnake': '免疫型敌人',
                    'poisonSpider': '环境互动敌人',
                    'saxKnight': 'Boss敌人'
                };
                return types[type] || '未知类型';
            }
            
            getAbilities(type) {
                const abilities = {
                    'snowApe': ['追踪玩家', '近战攻击'],
                    'shaolinMonk': ['四向飞标投射', '房间巡游', '追踪攻击'],
                    'redSnake': ['对道具免疫', '对武器免疫', '游走移动', '路径跟随'],
                    'poisonSpider': ['吐网攻击', '水下生存', '机关触发', '奖励掉落'],
                    'saxKnight': ['冲锋攻击', '挥砍攻击', '践踏攻击', '岩石掉落']
                };
                return abilities[type] || [];
            }
            
            getWeaknesses(type) {
                const weaknesses = {
                    'snowApe': ['冰锥砸击', '瓦缸限制', '冰冻效果', '少林弟子攻击'],
                    'shaolinMonk': ['头顶岩石砸击', '冰冻效果', '互相投掷飞标', '环境机关'],
                    'redSnake': ['岩石砸击', '环境陷阱', '坠落伤害'],
                    'poisonSpider': ['岩石砸击', '冰冻效果', '水下机关'],
                    'saxKnight': ['头顶岩石砸击', '攻击后易伤窗口']
                };
                return weaknesses[type] || [];
            }
            
            simulateBehavior(enemy, deltaTime) {
                // 简单的模拟行为：随机移动
                if (Math.random() < 0.02) {
                    enemy.velocityX = (Math.random() - 0.5) * 2;
                    enemy.velocityY = (Math.random() - 0.5) * 2;
                }
                
                enemy.x += enemy.velocityX || 0;
                enemy.y += enemy.velocityY || 0;
                
                // 边界检查
                enemy.x = Math.max(16, Math.min(784, enemy.x));
                enemy.y = Math.max(16, Math.min(584, enemy.y));
            }
            
            simulateRender(enemy, ctx) {
                // 简单的渲染：绘制彩色矩形
                const colors = {
                    'snowApe': '#8B4513',
                    'shaolinMonk': '#8B0000',
                    'redSnake': '#DC143C',
                    'poisonSpider': '#2F4F2F',
                    'saxKnight': '#2F4F4F'
                };
                
                ctx.fillStyle = colors[enemy.type] || '#FF0000';
                ctx.fillRect(enemy.x - 16, enemy.y - 16, 32, 32);
                
                // 绘制名称
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(enemy.name, enemy.x, enemy.y - 20);
            }
            
            clearAllEnemies() {
                this.enemies = [];
            }
            
            getStatistics() {
                return {
                    total: this.enemies.length,
                    active: this.enemies.filter(e => e.isActive).length,
                    byType: this.enemies.reduce((acc, enemy) => {
                        acc[enemy.type] = (acc[enemy.type] || 0) + 1;
                        return acc;
                    }, {})
                };
            }
        }
        
        // 初始化
        let enemyManager = new MockEnemyManager();
        let canvas = document.getElementById('test-canvas');
        let ctx = canvas.getContext('2d');
        let debugMode = false;
        let gameRunning = false;
        
        // 生成敌人卡片（仅用于展示，不添加到渲染列表）
        function generateEnemyCards() {
            const enemyGrid = document.getElementById('enemy-grid');
            const enemyTypes = ['snowApe', 'shaolinMonk', 'redSnake', 'poisonSpider', 'saxKnight'];
            
            enemyTypes.forEach(type => {
                // 创建临时敌人用于获取描述信息
                const tempEnemy = {
                    type: type,
                    getDescription: () => {
                        const config = enemyManager.enemyConfigs[type];
                        return {
                            name: config.name,
                            type: enemyManager.getEnemyType(type),
                            health: 100,
                            maxHealth: 100,
                            damage: 20,
                            abilities: enemyManager.getAbilities(type),
                            weaknesses: enemyManager.getWeaknesses(type),
                            world: config.world
                        };
                    }
                };
                
                const description = tempEnemy.getDescription();
                
                const card = document.createElement('div');
                card.className = 'enemy-card';
                
                const worldClass = description.world === 'angkor_wat' ? 'angkor-wat' : 
                                 description.world === 'bavaria' ? 'bavaria' : 'tibet';
                
                card.innerHTML = `
                    <div class="world-tag ${worldClass}">${description.world === 'angkor_wat' ? '吴哥窟' : description.world === 'bavaria' ? '巴伐利亚地牢' : '西藏雪山'}</div>
                    <h3>${description.name}</h3>
                    <div class="enemy-stats">
                        <div class="stat-row">
                            <span class="stat-label">类型:</span>
                            <span class="stat-value">${description.type}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">生命值:</span>
                            <span class="stat-value">${description.health}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">攻击力:</span>
                            <span class="stat-value">${description.damage}</span>
                        </div>
                    </div>
                    <div class="abilities">
                        <h4>技能:</h4>
                        <ul>
                            ${description.abilities.map(ability => `<li>${ability}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="weaknesses">
                        <h4>弱点:</h4>
                        <ul>
                            ${description.weaknesses.map(weakness => `<li>${weakness}</li>`).join('')}
                        </ul>
                    </div>
                `;
                
                enemyGrid.appendChild(card);
            });
        }
        
        // 游戏循环
        function gameLoop() {
            if (!gameRunning) return;
            
            // 清除画布
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格背景（可选）
            drawGrid();
            
            // 更新和渲染敌人
            enemyManager.enemies.forEach(enemy => {
                if (enemy.isActive && !enemy.isDead) {
                    enemy.update(1/60, enemyManager.gameState);
                    enemy.render(ctx);
                }
            });
            
            // 渲染调试信息
            if (debugMode) {
                renderDebugInfo();
            }
            
            // 更新信息面板
            updateInfoPanel();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 绘制网格背景
        function drawGrid() {
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 1;
            
            // 绘制垂直线
            for (let x = 0; x <= canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // 绘制水平线
            for (let y = 0; y <= canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        // 渲染调试信息
        function renderDebugInfo() {
            ctx.fillStyle = '#00FF00';
            ctx.font = '12px monospace';
            ctx.textAlign = 'left';
            
            let y = 20;
            enemyManager.enemies.forEach(enemy => {
                if (enemy.isActive) {
                    ctx.fillText(`${enemy.name}: (${Math.round(enemy.x)}, ${Math.round(enemy.y)})`, 10, y);
                    y += 15;
                }
            });
        }
        
        // 更新信息面板
        function updateInfoPanel() {
            const stats = enemyManager.getStatistics();
            const info = document.getElementById('enemy-info');
            
            info.innerHTML = `
                <strong>敌人统计:</strong><br>
                总数: ${stats.total}<br>
                活跃: ${stats.active}<br>
                按类型分布: ${JSON.stringify(stats.byType, null, 2)}
            `;
        }
        
        // 控制函数
        function spawnRandomEnemy() {
            const types = ['snowApe', 'shaolinMonk', 'redSnake', 'poisonSpider', 'saxKnight'];
            const type = types[Math.floor(Math.random() * types.length)];
            // 确保敌人位置在Canvas边界内（留出32像素边距）
            const margin = 32;
            const x = Math.random() * (canvas.width - 2 * margin) + margin;
            const y = Math.random() * (canvas.height - 2 * margin) + margin;
            
            const enemy = enemyManager.createEnemy(type, x, y);
            console.log('生成随机敌人:', enemy.name, '位置:', Math.round(x), Math.round(y));
        }
        
        function spawnAllEnemies() {
            const types = ['snowApe', 'shaolinMonk', 'redSnake', 'poisonSpider', 'saxKnight'];
            const positions = [
                { x: 150, y: 150 }, { x: 250, y: 150 }, { x: 350, y: 150 },
                { x: 450, y: 150 }, { x: 550, y: 150 }
            ];
            
            types.forEach((type, index) => {
                const pos = positions[index];
                const enemy = enemyManager.createEnemy(type, pos.x, pos.y);
                console.log('生成敌人:', enemy.name, '位置:', pos.x, pos.y);
            });
        }
        
        function clearEnemies() {
            enemyManager.clearAllEnemies();
            console.log('清除所有敌人');
        }
        
        function toggleDebug() {
            debugMode = !debugMode;
        }
        
        // 启动游戏循环
        function startGameLoop() {
            if (!gameRunning) {
                gameRunning = true;
                gameLoop();
                console.log('游戏循环已启动');
            }
        }
        
        // 停止游戏循环
        function stopGameLoop() {
            gameRunning = false;
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('页面加载完成，初始化敌人系统...');
            generateEnemyCards();
            startGameLoop();
        });
    </script>
</body>
</html>
