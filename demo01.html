<!DOCTYPE html>
<html lang="zh-CN">

      <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .title {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #333;
        }
        .section {
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            padding-left: 8px;
            border-left: 3px solid #666;
            color: #444;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }
        .btn {
            padding: 12px 15px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover {
            border-color: #999;
            background: #f8f8f8;
        }
        .btn:active {
            background: #f0f0f0;
        }
        .log-container {
            margin-top: 40px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
            height: 360px;
            overflow-y: auto;
            background: #fafafa;
        }
        .log-item {
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }
        .log-item:last-child {
            border-bottom: none;
        }
        .log-time {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        .log-content {
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }
        pre {
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 3px;
            margin-top: 5px;
            overflow-x: auto;
        }
        /* 补充登录区域样式，保持原始结构 */
        .login-area {
            margin: 30px 0;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .login-area input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
        }
        .login-area button {
            padding: 10px 20px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .login-area button#logoutBtn {
            background: #f56565;
        }
    </style>

</head>

<body>
       <h1 class="title">功能测试</h1>

   <div class="container">
        <!-- 第一组：基础配置按钮 -->
        <div class="btn-group">
            <button class="btn btn-success" onclick="toggleDebug(true)">开启调试模式</button>
            <button class="btn btn-danger" onclick="toggleDebug(false)">关闭调试模式</button>
            <button class="btn btn-success" onclick="toggleDataCollect(true)">开启数据采集</button>
            <button class="btn btn-danger" onclick="toggleDataCollect(false)">关闭数据采集</button>
        </div>

        <div class="btn-group">
            <button class="btn btn-success" onclick="toggleserverUrl()">修改数据上报请求地址</button>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="getSDKConfig()">获取SDK配置</button>
            <button class="btn" onclick="getUserAgent()">获取增强型UA</button>
        </div>

        <!-- 新增：用户ID相关测试按钮组 -->
        <div class="login-area">
          <input type="text" id="userId" placeholder="请输入userId" autocomplete="off">
          <input type="text" id="userKey" placeholder="请输入userKey（可选）" autocomplete="off">
          <button id="loginBtn">登录</button>
          <button id="logoutBtn" style="display: none;">退出登录</button>
        </div>

        <div class="section">
            <div class="btn-group">
                <button class="btn" onclick="getDeviceId()">获取设备ID</button>
                <button class="btn btn-success" onclick="setUserId()">设置登录用户ID</button>
                <button class="btn btn-success" onclick="setUserIdWithKey()">设置登录用户ID（带userKey）</button>
                <button class="btn btn-danger" onclick="clearUserId()">清除登录用户ID</button>
                <button class="btn" onclick="setUserAttributes()">设置用户属性</button>
            </div>
        </div>



        <p></p>
        <!-- 第三组：埋点事件按钮 -->
        <div class="btn-group">
            <button class="btn btn-success" onclick="trackBaseEvent()">埋点事件02</button>

            <button class="btn btn-success" onclick="trackAttrEvent()">埋点事件03</button>

            <button class="btn" onclick="setGeneralProps()">设置全局通用属性</button>

            <button class="btn btn-warning" onclick="clearGeneralProps()">清空全局属性</button>




        </div>




        <!--  设置页面变更回调(setPageListener)
          
        //调用api设置回调方法时，会立即执行一次回调，以保证当前页面的浏览能正确触发。
        //如果关闭了 trackPage，需要在SDK初始化完成后尽快设置页面变更回调并发送页面访问事件，避免丢失页面访问数据
        //api多次调用会覆盖回调方法，不同页面上的特殊处理可以直接使用if判断props值，建议在SDK初始化完成后立即调用一次即可。否则可能出现同一个页面发送两次页面访问事件的情况。
        -->

        <div class="btn-group" role="group" aria-label="事件跟踪操作">

               <button class="btn btn-success" onclick="triggerPageChangeCallback()">页面变更回调</button>
               
            <button class="btn btn-success" onclick="configurePageAttributes()">设置页面属性</button>
            <button class="btn btn-default" onclick="clearPageProps()">清除页面属性</button>
            <button class="btn btn-warning" onclick="manualSendPageView()">手动发送页面访问事件</button>
            <button class="btn btn-info" onclick="setEventInterceptor()">设置事件发送前拦截</button>
            <button class="btn btn-primary" onclick="getSDKConfig()">获取SDK当前配置</button>
            <button class="btn btn-danger" onclick="getEnhancedData()">获取当前的增强型数据</button>
        </div>


        <!-- 设置页面属性(setPageAttributes)
        
        //仅生效于当前页面的页面浏览事件和无埋点事件。仅在初始化配置项关闭 trackPage时可用。

        //gdp('setPageAttributes', properties: object);

        -->

        <p></p>
        <!-- 第四组：事件时长统计按钮 -->
        <div class="btn-group">
            <button class="btn btn-success" onclick="startTimer()">启动计时器</button>
            <button class="btn btn-warning" onclick="pauseTimer()">暂停计时器</button>
            <button class="btn btn-success" onclick="resumeTimer()">恢复计时器</button>
            <button class="btn btn-danger" onclick="endTimer()">停止计时器（上报事件）</button>
            <button class="btn btn-danger" onclick="clearAllTimers()">清除所有计时器</button>
        </div>

       
    </div>

    <script>
        // 全局变量：计时器ID
        let timerId = '';

        // 1. 切换调试模式
        function toggleDebug(flag) {
            gdp('setOption', 'debug', flag);
        }

        // 2. 切换数据采集
        function toggleDataCollect(flag) {
            gdp('setOption', 'dataCollect', flag);
        }

        // 3. 修改数据上报请求地址
        function toggleserverUrl() {
            gdp('setOption', 'serverUrl', 'http://api.growingio.com');
        }

        // 4. 获取SDK配置
        function getSDKConfig() {
            gdp('getOption', '', (config) => {
               
            });
        }

        // 5. 获取增强型UA
        function getUserAgent() {
            gdp('getUserAgent', (ua) => {
              
            });
        }

        // 6. 获取设备ID
        function getDeviceId() {
            gdp('getDeviceId', (deviceId) => {
               
            });
        }

        // 7. 设置登录用户ID（无userKey）
        function setUserId() {
            const testUserId = `user_${Math.floor(Math.random() * 1000000)}`;
            gdp('setUserId', testUserId, () => {
                document.getElementById('logoutBtn').style.display = 'inline-block';
                document.getElementById('userId').value = testUserId;
            });
        }

        // 8. 设置登录用户ID（带userKey）
        function setUserIdWithKey() {
            const testUserId = `user_${Math.floor(Math.random() * 1000000)}`;
            const userKey = 'custom_user_id'; // 自定义用户ID类型（需在GrowingIO平台配置）
            gdp('setUserId', testUserId, userKey, () => {
                document.getElementById('logoutBtn').style.display = 'inline-block';
                document.getElementById('userId').value = testUserId;
                document.getElementById('userKey').value = userKey;
            });
        }

        // 9. 清除登录用户ID
        function clearUserId() {
            gdp('clearUserId', () => {
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('userId').value = '';
                document.getElementById('userKey').value = '';
            });
        }

        // 10. 设置登录用户属性（基础字段）
        function setUserAttributes() {
            const userAttributes = {
                username: '测试用户' + Math.floor(Math.random() * 100),
                age: Math.floor(Math.random() * 30) + 18,
                gender: Math.random() > 0.5 ? 'male' : 'female',
                registerTime: new Date().toLocaleDateString()
            };
            gdp('setUserAttributes', userAttributes);
        }

        // 11. 登录按钮点击事件（修复原始代码缺失）
        document.getElementById('loginBtn').addEventListener('click', function() {
            const userId = document.getElementById('userId').value.trim();
            const userKey = document.getElementById('userKey').value.trim() || undefined;

            if (!userId) return;

            // 处理userId长度限制（超过1000字符截取）
            const finalUserId = userId.length > 1000 ? userId.substring(0, 1000) : userId;

            if (userKey) {
                gdp('setUserId', finalUserId, userKey, () => {
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                });
            } else {
                gdp('setUserId', finalUserId, () => {
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                });
            }
        });

        // 12. 退出登录按钮点击事件
        document.getElementById('logoutBtn').addEventListener('click', function() {
            clearUserId();
        });

        // 13. 埋点事件，按钮序号，用户ID，手机号gdp('setPageListener', ({ path, query, title }) => {
        // 根据path/query/title做判断只针对某些页面做一些事，例如设置页面属性
        // if (path === 'path/aaa') {
        //     gdp('setPageAttributes', {
        //     page_type: 'page type',
        //     page_level: 'page level'
        //     });
        // }

        // 不判断页面，“全局“设置页面属性（即每次发页面浏览事件之前都设一次页面属性）
        // gdp('setPageAttributes', {
        //     page_url: path,
        //     page_title: title
        // });

        // 不要做接口调用或复杂运算等耗时过长的操作，以免耽误页面访问事件的发送或数据解析错误导致丢数和数据错误
        
        // 设置完页面属性后手动控制发送页面访问事件
        // gdp('sendPage');

        // 发送跟页面地址绑定的埋点要在sendPage后

        function trackBaseEvent() {
          gdp('track', 'demo01', {
            button_id: 'one',
            user_id: ['cola', 'milk', 'juice'], 
            phone_identity: '10086',
            });
        }

        // 14. 埋点事件
        function trackAttrEvent() {
     gdp('track', 'demo01', {
            user: "绘画纸",
            user_id: ['co', 'lk', 'juck'],
            phone_identity: '1008611',
            });
        }
        // 15. 设置全局通用属性
        function setGeneralProps() {
        gdp('setGeneralProps', { 'currency': 'RMB' });

        // 变量
        let index = 0;
        gdp('setGeneralProps', {
        'nick_name_var': 'Mike',
        'index_var': () => index++
        });

        }

        // 16. 清空全局通用属性
        function clearGeneralProps() {
            gdp('clearGeneralProps', []);
        }




       


        // 17. 启动计时器
        function startTimer() {
            if (timerId) return;
            gdp('trackTimerStart', 'test_duration_event', (id) => {
                timerId = id;
            });
        }


        //设置页面变更回调


        // 18. 暂停计时器
        function pauseTimer() {
            if (!timerId) return;
            gdp('trackTimerPause', timerId);
        }

        // 19. 恢复计时器
        function resumeTimer() {
            if (!timerId) return;
            gdp('trackTimerResume', timerId);
        }

        // 20. 停止计时器（上报事件）
        function endTimer() {
            if (!timerId) return;
            const attributes = { testKey: 'duration_test' };
            gdp('trackTimerEnd', timerId, attributes, () => {
                timerId = '';
            });
        }

        // 21. 清除所有计时器
        function clearAllTimers() {
            gdp('clearTrackTimer', () => {
                timerId = '';
            });
        }
    </script>
</body>
</html>
