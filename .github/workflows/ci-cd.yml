name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天凌晨2点运行依赖检查
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  NPM_VERSION: '9'

jobs:
  # 代码质量检查
  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史用于语义化版本检查
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint
      continue-on-error: false
    
    - name: Check Prettier formatting
      run: npm run format:check
      continue-on-error: false
    
    - name: Check for TODO/FIXME comments
      run: |
        TODO_COUNT=$(grep -r "TODO\|FIXME" src/ --include="*.js" --include="*.html" --include="*.css" | wc -l)
        if [ $TODO_COUNT -gt 0 ]; then
          echo "⚠️  Found $TODO_COUNT TODO/FIXME comments"
          grep -r "TODO\|FIXME" src/ --include="*.js" --include="*.html" --include="*.css"
        fi
    
    - name: Security audit
      run: npm audit --audit-level moderate
      continue-on-error: true

  # 单元测试和集成测试
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-type: [unit, integration]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: |
        if [ "${{ matrix.test-type }}" = "unit" ]; then
          npm run test:unit
        else
          npm run test:integration
        fi
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: ${{ matrix.test-type }}
        name: codecov-${{ matrix.test-type }}
        fail_ci_if_error: false

  # 构建和部署
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Validate build
      run: |
        echo "🔍 Validating project structure..."
        [ -f "index.html" ] || { echo "❌ Missing index.html"; exit 1; }
        [ -d "src" ] || { echo "❌ Missing src directory"; exit 1; }
        [ -d "src/scripts" ] || { echo "❌ Missing scripts directory"; exit 1; }
        [ -d "src/styles" ] || { echo "❌ Missing styles directory"; exit 1; }
        echo "✅ Project structure validation passed"
    
    - name: Test local server
      run: |
        echo "🧪 Testing local server startup..."
        npx http-server -p 8080 &
        SERVER_PID=$!
        sleep 3
        
        # 测试服务器是否响应
        if curl -f http://localhost:8080 > /dev/null 2>&1; then
          echo "✅ Local server test passed"
        else
          echo "❌ Local server test failed"
          kill $SERVER_PID
          exit 1
        fi
        
        kill $SERVER_PID
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        force_orphan: true
        cname: ${{ secrets.CNAME }}
    
    - name: Deploy status notification
      run: |
        echo "🚀 Deployment completed!"
        echo "🌐 Game URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        echo "📊 Repository: https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}"

  # 性能测试
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run Lighthouse CI
      run: |
        npm install -g @lhci/cli@0.12.x
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # 依赖检查
  dependency-check:
    name: Dependency Security
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      run: npm audit --audit-level high
      continue-on-error: true
    
    - name: Check for outdated dependencies
      run: |
        npx npm-check-updates --errorLevel 2
      continue-on-error: true
    
    - name: License check
      run: |
        npm install -g license-checker
        license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC' --summary
      continue-on-error: true

  # 发布管理
  release:
    name: Release Management
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, build-and-deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        body: |
          ## 🎮 Diamond Frenzy Web v${{ github.ref_name }}
          
          ### 🚀 Deployment
          - **Live Game**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          - **Repository**: https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}
          
          ### 📊 Build Information
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Build Time**: ${{ github.event.head_commit.timestamp }}
          
          ### 🧪 Testing
          - **Unit Tests**: ✅ Passed
          - **Integration Tests**: ✅ Passed
          - **Code Coverage**: Available in CI logs
          
          ### 🔧 Technical Details
          - **Node.js**: ${{ env.NODE_VERSION }}
          - **NPM**: ${{ env.NPM_VERSION }}
          - **Build Status**: ${{ job.status }}
          
          ---
          *Built with ❤️ by MiniMax Agent*
    
    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./package.json
        asset_name: package.json
        asset_content_type: application/json

  # 通知和报告
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, build-and-deploy, dependency-check]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.lint-and-format.result == 'success' && needs.test.result == 'success' && needs.build-and-deploy.result == 'success'
      run: |
        echo "🎉 All checks passed! Deployment successful."
        echo "🌐 Game is live at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
    
    - name: Notify failure
      if: needs.lint-and-format.result == 'failure' || needs.test.result == 'failure' || needs.build-and-deploy.result == 'failure'
      run: |
        echo "❌ Some checks failed:"
        echo "  - Linting: ${{ needs.lint-and-format.result }}"
        echo "  - Tests: ${{ needs.test.result }}"
        echo "  - Build & Deploy: ${{ needs.build-and-deploy.result }}"
        echo "Please check the workflow logs for details."
        exit 1