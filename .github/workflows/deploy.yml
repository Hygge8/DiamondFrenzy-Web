name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm install -g http-server
        
    - name: Test build
      run: |
        # 检查关键文件是否存在
        if [ ! -f "index.html" ]; then
          echo "Error: index.html not found"
          exit 1
        fi
        
        if [ ! -d "js" ]; then
          echo "Error: js directory not found"
          exit 1
        fi
        
        # 启动测试服务器
        http-server -p 8080 &
        sleep 3
        
        # 检查服务器是否启动
        if curl -f http://localhost:8080 > /dev/null 2>&1; then
          echo "✅ Test server started successfully"
        else
          echo "❌ Test server failed to start"
          exit 1
        fi
        
        # 停止测试服务器
        kill %1
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        force_orphan: true
        
    - name: Deploy Status
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🚀 Deployment completed!"
        echo "🌐 Your game is available at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        echo ""
        echo "📊 Repository: https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}"
        echo "⚙️  Settings: https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/settings/pages"