    <div class="login-area">
        <input type="text" id="userId" placeholder="userId" disabled>

        <button id="loginBtn">登录</button>

    </div>

    <!-- 25个按钮容器（直接手动编写，方便后续加API） -->

    <script>
        // 获取DOM元素
        const userIdInput = document.getElementById('userId');
        const userKeyInput = document.getElementById('userKey');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const btnContainer = document.getElementById('btnContainer');
        let userInfo = null; // 存储登录用户信息，方便API调用时使用

        // 登录功能
        loginBtn.addEventListener('click', () => {
            if (loginBtn.textContent === '登录') {
                // 第一次点击：解锁输入框
                userIdInput.disabled = false;
                userKeyInput.disabled = false;
                userIdInput.focus();
                loginBtn.textContent = '确认登录';
            } else {
                // 第二次点击：确认登录
                const userId = userIdInput.value.trim();
                const userKey = userKeyInput.value.trim();
                
                if (userId && userKey) {
                    // 保存用户信息（后续API调用可使用）
                    userInfo = { userId, userKey };
                    // 显示按钮容器和退出按钮
                    btnContainer.style.display = 'block';
                    logoutBtn.style.display = 'inline-block';
                    loginBtn.style.display = 'none';
                } else {
                    alert('请输入完整的userId和userKey');
                }
            }
        });

        // 退出登录功能
        logoutBtn.addEventListener('click', () => {
            // 重置状态
            userIdInput.value = '';
            userKeyInput.value = '';
            userIdInput.disabled = true;
            userKeyInput.disabled = true;
            loginBtn.textContent = '登录';
            loginBtn.style.display = 'inline-block';
            logoutBtn.style.display = 'none';
            btnContainer.style.display = 'none';
            userInfo = null; // 清空用户信息
        });

        // 按钮点击事件（后续在此处添加API调用）
        function handleBtnClick(btnNum) {
            if (!userInfo) return; // 未登录不执行操作
            
            // 示例：后续在此处添加API调用逻辑
            console.log(`点击了按钮${btnNum}，当前登录用户：`, userInfo);
